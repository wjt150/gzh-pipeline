<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; background:#1a4d8f; color:#fff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:110px 96px 100px; display:flex; flex-direction:column;
  }
  .brand { font-size:26px; opacity:.55; }
  h1 {
    font-size:88px; line-height:1.36; font-weight:700;
    margin-top:56px; letter-spacing:1px;
  }
  .opts { margin-top:150px; }
  .opt {
    display:flex; align-items:baseline; gap:30px;
    padding:38px 4px; border-bottom:1px solid rgba(255,255,255,.16);
  }
  .opt:last-child { border-bottom:none; }
  .idx { font-size:28px; opacity:.45; width:34px; flex:0 0 34px; }
  .txt { font-size:44px; font-weight:500; letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="brand">AI 引路灯</div>

  <h1>AI 替你省下的时间，<br>你拿去干什么了？</h1>

  <div class="opts">
    <div class="opt"><div class="idx">01</div><div class="txt">摸鱼，什么都没干</div></div>
    <div class="opt"><div class="idx">02</div><div class="txt">学新东西，让自己更贵</div></div>
    <div class="opt"><div class="idx">03</div><div class="txt">陪家人、休息、发呆</div></div>
    <div class="opt"><div class="idx">04</div><div class="txt">接了更多活，反而更忙</div></div>
  </div>
</body>
</html>
