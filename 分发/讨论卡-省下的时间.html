<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; background:#1a4d8f; color:#fff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:96px 88px 84px;
  }
  .brand { font-size:26px; letter-spacing:6px; opacity:.62; font-weight:400; }
  .lead { font-size:30px; line-height:1.7; opacity:.75; margin-top:14px; }
  h1 {
    font-size:86px; line-height:1.34; font-weight:800; letter-spacing:1px;
    margin-top:52px;
  }
  h1 em { font-style:normal; color:#ffd873; }
  .opts { margin-top:auto; display:flex; flex-direction:column; gap:22px; }
  .opt {
    display:flex; align-items:center; gap:26px;
    border:2px solid rgba(255,255,255,.22); border-radius:16px;
    padding:34px 38px; background:rgba(255,255,255,.06);
  }
  .idx {
    width:56px; height:56px; flex:0 0 56px; border-radius:50%;
    background:#fff; color:#1a4d8f; font-size:30px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .txt { font-size:42px; font-weight:600; letter-spacing:.5px; }
  .foot { margin-top:56px; font-size:27px; line-height:1.8; opacity:.6; }
</style>
</head>
<body>
  <div>
    <div class="brand">AI 余量</div>
    <div class="lead">一个只问一句的号</div>
    <h1>AI 替你省下的时间，<br>你拿去<em>干什么</em>了？</h1>
  </div>

  <div class="opts">
    <div class="opt"><div class="idx">1</div><div class="txt">摸鱼，什么都没干</div></div>
    <div class="opt"><div class="idx">2</div><div class="txt">学新东西，让自己更贵</div></div>
    <div class="opt"><div class="idx">3</div><div class="txt">陪家人、休息、发呆</div></div>
    <div class="opt"><div class="idx">4</div><div class="txt">接了更多活，反而更忙</div></div>
  </div>

  <div class="foot">选一个，再说一句为什么。<br>最想听第 4 种人的答案。</div>
</body>
</html>
